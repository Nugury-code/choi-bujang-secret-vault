<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 점령된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; white-space: pre-wrap; overflow-wrap: anywhere; }
    .auth { margin: 26px 0; padding: 18px; border: 1px solid #51667c; border-radius: 14px; background: #152335; }
    .auth h2 { margin: 0 0 12px; font-size: 20px; }
    .auth label { display: block; margin: 12px 0 6px; font-size: 15px; color: #bfd0e5; }
    .auth input, .auth textarea, li input, li textarea { box-sizing: border-box; width: 100%; padding: 11px 12px; border: 1px solid #51667c; border-radius: 10px; background: #0d1623; color: #ecf4ff; font-size: 16px; font-family: inherit; }
    li input, li textarea { margin-bottom: 8px; }
    .auth textarea, li textarea { resize: vertical; }
    .auth button { margin-top: 16px; padding: 11px 20px; border: 0; border-radius: 10px; background: #8ad8df; color: #0d1623; font-size: 16px; font-weight: 700; cursor: pointer; }
    .auth button:disabled { opacity: .6; cursor: wait; }
    .auth .error { margin: 12px 0 0; color: #ffb4c0; font-size: 15px; }
    .auth .who { margin: 0 0 4px; }
    .auth .who strong { display: inline; margin: 0; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .actions button { padding: 7px 14px; border: 1px solid #51667c; border-radius: 8px; background: #152335; color: #ecf4ff; font-size: 14px; cursor: pointer; }
    .actions button.danger { border-color: #d07384; color: #ffb4c0; }
    .actions button:disabled { opacity: .6; cursor: wait; }
    [hidden] { display: none !important; }
  </style>
</head>
<body data-auth="checking">
  <main>
    <div class="eyebrow">BYTE BACK · 3단계 로그인 화면</div>
    <h1>점령된 자료실</h1>
    <p>지금은 서버 보호가 아직 없는 상태입니다. 아래 기록은 모두 실습을 위해 만든 가상 자료입니다.</p>
    <section class="auth" aria-labelledby="auth-title">
      <h2 id="auth-title">로그인</h2>
      <p id="auth-status" role="status">로그인 상태를 확인하는 중입니다.</p>
      <form id="login-form" novalidate hidden>
        <label for="email">이메일</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button id="login-button" type="submit">로그인</button>
      </form>
      <div id="signed-in" hidden>
        <p class="who">로그인한 계정: <strong id="account-email"></strong></p>
        <button id="logout-button" type="button">로그아웃</button>
      </div>
      <p id="auth-error" class="error" role="alert" hidden></p>
    </section>
    <section id="note-editor" class="auth" aria-labelledby="editor-title" hidden>
      <h2 id="editor-title">메모 추가</h2>
      <form id="note-form" novalidate>
        <label for="note-title">제목</label>
        <input id="note-title" name="title" type="text" maxlength="120" autocomplete="off">
        <label for="note-body">내용</label>
        <textarea id="note-body" name="body" rows="3" maxlength="5000"></textarea>
        <button id="note-add" type="submit">추가</button>
      </form>
      <p id="note-error" class="error" role="alert" hidden></p>
    </section>
    <div class="notice">아래 자료는 로그인한 사람에게만 보이고, 목록에는 내가 추가한 메모와 처음 가상 메모만 나옵니다. 아직 서버가 메모의 주인을 검사하지 않아서, 로그인한 사람이 다른 사람 메모의 번호를 알면 고치거나 지울 수 있습니다(소유자 검사는 4단계).</div>
    <ul id="notes" aria-live="polite"><li>로그인 상태를 확인하는 중입니다.</li></ul>
  </main>
  <script src="/vendor/supabase.js"></script>
  <script src="/app.js" type="module"></script>
</body>
</html>
